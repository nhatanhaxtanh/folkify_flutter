name: folkify_flutter
description: "Folkify - App học nhạc cụ dân tộc Việt Nam"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  iconsax: ^0.0.8

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  youtube_player_flutter: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
